<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Battery health{% endblock %}</title>
<style>
:root{--bg:#f6f7f8;--card:#fff;--fg:#16181d;--mut:#667085;--line:#e3e6ea;--acc:#0b63ce;--ok:#18794e;--watch:#ad5700;--alert:#c62a2f;--info:#3a5ccc}
@media (prefers-color-scheme:dark){:root{--bg:#111316;--card:#1a1d21;--fg:#e8eaed;--mut:#9aa4b2;--line:#2b3036;--acc:#6aa9ff;--ok:#4cc38a;--watch:#f1a10d;--alert:#ff6369;--info:#8da4ef}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:920px;margin:0 auto;padding:24px 16px 64px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
h1{font-size:20px;margin:0}h2{font-size:15px;margin:0 0 12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mut)}
a{color:var(--acc)}.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:16px}
table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.04em}tr:last-child td{border-bottom:0}
.mut{color:var(--mut)}.small{font-size:13px}.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:4px}
input,select{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg);font:inherit}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;align-items:end}
button,.btn{display:inline-block;padding:8px 14px;border-radius:6px;border:1px solid var(--acc);background:var(--acc);color:#fff;font:inherit;cursor:pointer;text-decoration:none}
button.sec{background:transparent;color:var(--acc)}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid currentColor;white-space:nowrap}
.ok{color:var(--ok)}.watch{color:var(--watch)}.alert{color:var(--alert)}.info{color:var(--info)}.na{color:var(--mut)}
.big{font-size:44px;font-weight:700;line-height:1.1}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px}
.banner{border-left:4px solid var(--watch);padding:10px 14px;background:var(--card);margin-bottom:16px;border-radius:4px}
svg{max-width:100%;height:auto}@media print{header form,.noprint{display:none}body{background:#fff}.card{break-inside:avoid}}
</style>
</head>
<body><main>
<header><h1><a href="/" style="color:inherit;text-decoration:none">Battery health</a></h1>{% block actions %}{% endblock %}</header>
{% block body %}{% endblock %}
</main></body></html>
